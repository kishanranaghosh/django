{% load static tailwind_tags %} {% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Chai</title>
    {% comment %} {% tailwind_css %} {% endcomment %}
  </head>
  <body class="bg-black">
    {% for chai in chais %}
    <div class="bg-white p-4 m-4 rounded-lg shadow-md">
      <h2 class="text-xl font-bold mb-2">{{ chai.name }}</h2>
      <p class="text-gray-700 mb-2">Type: {{ chai.get_chai_type_display }}</p>
      <img src="{{ chai.image.url }}" alt="{{ chai.name }}" class="w-32 h-32 object-cover mb-2" />
      <p class="text-gray-700 mb-2">Date Added: {{ chai.date_added }}</p>
    </div>
    {% endfor %} 
  </body>
</html>
